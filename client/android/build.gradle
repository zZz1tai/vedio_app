// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    // 阿里云镜像优先（repo1.maven.org / dl.google.com 当前网络不可达）
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // expo 模块 prebuilt AAR：打包在 npm 包内的 local-maven-repo（host.exp.exponent:* / BareExpo:*）
    // 由 expo 发布，不在任何公共镜像，必须走本地文件仓库
    def expoNodeRoot = new File(rootDir, '../node_modules')
    def expoModuleDirs = expoNodeRoot.listFiles()
    if (expoModuleDirs != null) {
      def localRepos = new ArrayList<File>()
      for (File dir : expoModuleDirs) {
        if (!dir.isDirectory()) continue
        if (dir.name == 'expo' || dir.name.startsWith('expo-')) {
          File lmr = new File(dir, 'local-maven-repo')
          if (lmr.exists()) localRepos.add(lmr)
        }
      }
      // @expo 作用域下的模块（如 @expo/vector-icons 之类无 AAR，跳过；真实 AAR 模块在 expo-*）
      for (File repo : localRepos) {
        // 与 expo 官方 expo-autolinking-settings 一致：mavenLocal() 允许无 pom 的 artifact-only 解析
        mavenLocal { localRepo ->
          localRepo.url = repo.toURI().toString()
        }
      }
    }
  }
}

// NOTE: the old buildDir redirection hook was removed on purpose.
// With pnpm node-linker=hoisted the dependency paths are already short enough,
// and RN autolinking's generated CMake expects codegen output under
// <module>/android/build — redirecting buildDir breaks :app cmake configure.

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
