// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// NOTE: the old buildDir redirection hook was removed on purpose.
// With pnpm node-linker=hoisted the dependency paths are already short enough,
// and RN autolinking's generated CMake expects codegen output under
// <module>/android/build — redirecting buildDir breaks :app cmake configure.

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
